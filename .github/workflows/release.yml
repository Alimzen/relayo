name: Release

# With pending changesets on main, opens (or updates) a "Version packages" pull request.
# Merging that pull request publishes the new versions to npm.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version packages" pull request
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm CLI.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: 'Version packages'
          title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not needed once every package has a trusted publisher on npmjs.com.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
